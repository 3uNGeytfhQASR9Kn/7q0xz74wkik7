<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>memo</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1f;--mute:#6e6e73;--line:#e3e3df;--card:#fff;--acc:#0b7a5a;--accbg:#e4f4ee;--warn:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--fg:#ececee;--mute:#9a9aa1;--line:#2c2c31;--card:#1a1a1e;--acc:#41d29b;--accbg:#173328;--warn:#f0a070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center}
header button,header select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px}
header select{flex:1;min-width:0;text-align:center;font-size:.9rem;padding:6px 2px}
header button:disabled{opacity:.35}
main{max-width:760px;margin:0 auto;padding:4px 12px 56px}
.meta{color:var(--mute);font-size:.8rem;margin:10px 2px}
h2.sec{font-size:.8rem;letter-spacing:.06em;color:var(--mute);margin:20px 2px 8px;font-weight:600}
.top{display:grid;gap:6px}
.topi{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.topi .r{font-weight:600;flex:0 0 5.6em;white-space:nowrap}
.topi .k{flex:0 0 3.4em}
.topi .k{color:var(--mute);font-size:.85rem;white-space:nowrap}
.topi .c{font-weight:600}
.topi .ev{margin-left:auto;color:var(--acc);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 16px;border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.wx{color:var(--mute);font-size:.8rem;margin:0 2px 6px}
details.race{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
details.race>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
details.race>summary::-webkit-details-marker{display:none}
.rn{grid-row:span 2;font-weight:700;font-size:1.05rem;background:var(--accbg);color:var(--acc);border-radius:8px;padding:6px 0;text-align:center;width:3.6em;min-width:3.6em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt{font-weight:600}
.rc{color:var(--mute);font-size:.8rem}
.hon{grid-column:2/4;font-size:.9rem}
.hon b{color:var(--acc)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card .l{color:var(--mute);font-size:.75rem}
.card .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--acc)}.neg{color:var(--warn)}
.win{color:var(--acc);font-weight:700}
.mute{color:var(--mute)}
header button.on{background:var(--acc);border-color:var(--acc);color:#fff}
a{color:var(--acc)}
.ver.live{color:var(--acc);font-weight:600}
.chev{color:var(--mute);transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.inner{padding:2px 12px 12px;border-top:1px solid var(--line)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.78rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
table.fx{table-layout:fixed}
table.fx td,table.fx th{overflow:hidden;text-overflow:ellipsis}
.m{font-weight:700;color:var(--acc);width:1.6em}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--acc);opacity:.55;vertical-align:middle;margin-left:6px}
.sub{font-size:.78rem;color:var(--mute);margin:12px 0 4px}
.ev{font-weight:700}
.ev.hi{color:var(--acc)}
footer{color:var(--mute);font-size:.75rem;margin:28px 2px}
</style>
</head>
<body>
<header>
  <button id="prev" aria-label="前の日">‹</button>
  <select id="sel" aria-label="日付"></select>
  <button id="next" aria-label="次の日">›</button>
  <button id="pl" aria-label="収支">収支</button>
</header>
<main id="view"></main>

const KINDS = ['単勝','複勝','枠連','馬連','ワイド','馬単','三連複','三連単'];
const VORD = ['札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉'];
const nums = c => (String(c).match(/\d+/g)||[]).map(Number);
function cmpArr(a,b){ for(let i=0;i<Math.max(a.length,b.length);i++){ const x=a[i]??-1, y=b[i]??-1; if(x!==y) return x-y; } return 0; }
const kidx = k => { const i = KINDS.indexOf(k); return i<0 ? KINDS.length : i; };
function betCmp(a,b){            // 競馬場 → 何レース目 → 券種 → 買い目の番号
  return (VORD.indexOf(a.v)-VORD.indexOf(b.v)) || (a.n-b.n) || (kidx(a.kind)-kidx(b.kind)) || cmpArr(nums(a.comb), nums(b.comb));
}
let venueOn = null, curDate = null, ledgerOn = false;
const wd = d => '日月火水木金土'[new Date(d+'T00:00:00').getDay()];

function raceHtml(r, ref){
  const h = r.horses, hon = h[0];
  const rows = h.map(x => `<tr><td class="m">${x.mark}</td><td class="n">${x.no}</td><td>${esc(x.name)}</td>
    <td class="n">${pct(x.p1)}<span class="bar" style="width:${Math.round(x.p1*90)}px"></span></td>
    <td class="n">${pct(x.p3,0)}</td><td>${esc(x.train)}</td></tr>`).join('');
  const hasStake = false;  // 日付の画面には結果を出さない（収支は『収支』ボタン）
  const bets = r.bets.map(b => `<tr>${hasStake?`<td>${resultHtml(b)}</td>`:''}<td>${b.kind}</td><td><b>${b.comb}</b></td><td class="n">${pct(b.p)}</td>
    <td class="n">${b.odds.toFixed(1)}${b.est?"*":""}</td><td class="n ev ${b.ev>=1.2?'hi':''}">${Math.round(b.ev*100)}%</td></tr>`).join('');
  return `<details class="race"><summary>
    <div class="rn">${r.no}R</div><div class="rt">${esc(r.name)}</div><div class="chev">›</div>
    <div class="rc">${r.cond}・${r.time}・<span class="ver ${r.live?'live':''}">${r.live?'直前 '+r.live+'版':'前日版'}</span></div>
    <div class="hon">◎ <b>${hon.no} ${esc(hon.name)}</b> ${pct(hon.p1,0)}</div></summary>
    <div class="inner">
      <div class="sub">出走馬（1着の確率の高い順）</div>
      <div class="tw"><table><tr><th></th><th class="n">番</th><th>馬名</th><th class="n">1着</th><th class="n">3着内</th><th>調教</th></tr>${rows}</table></div>
      <div class="sub">買い目（券種・買い目の順・各100円）</div>
      <div class="tw"><table><tr>${hasStake?'<th>結果</th>':''}<th>券種</th><th>買い目</th><th class="n">的中</th><th class="n">オッズ</th><th class="n">期待</th></tr>${bets}</table></div>
    </div></details>`;
}

function ledgerRows(){            // 賭け金のある買い目
  const out=[];
  for(const d of dates) for(const [v,rs] of Object.entries(DAYS[d].venues)) for(const r of rs) for(const b of r.bets)
    if(b.stake) out.push({d, ref:!!DAYS[d].ref, race:v+r.no+'R', v, n:r.no, live:!!r.live, ...b});
  return out.sort(betCmp);
}
function showLedger(mode){
  mode = mode || 'real'; ledgerOn = true; curDate = null;
  document.getElementById('pl').classList.add('on');
  const all = ledgerRows(), rows = all.filter(b => b.ref === (mode==='ref')), by = {};
  for(const b of rows){
    const x = by[b.d] = by[b.d] || {stake:0, ret:0, n:0, hit:0, pend:0, bets:[]};
    x.bets.push(b);
    if(b.ret===undefined || b.ret===null){ x.pend++; continue; }
    x.n++; x.stake+=b.stake; x.ret+=b.ret; x.hit+=b.ret>b.stake;
  }
  const ds = Object.keys(by).sort().reverse();
  const T = ds.reduce((a,d)=>({stake:a.stake+by[d].stake, ret:a.ret+by[d].ret, n:a.n+by[d].n, hit:a.hit+by[d].hit, pend:a.pend+by[d].pend}), {stake:0,ret:0,n:0,hit:0,pend:0});
  const nRef = all.filter(b => b.ref).length;
  let h = nRef ? `<div class="tabs"><button data-m="real" class="${mode==='real'?'on':''}">記録</button><button data-m="ref" class="${mode==='ref'?'on':''}">過去の参考</button></div>` : '';
  h += mode==='ref'
    ? `<div class="meta">参考（仮）: 記録の開始（${START}）より前の予想に、同じルールで仮にかけていたらの収支。実際にかけたものではありません。</div>`
    : `<div class="meta">収支の記録（${START} 以降）。期待回収率100%以上の買い目に、100円×期待回収率の整数部分をかけた場合。直前版が出たレースは直前版の買い目。</div>`;
  if(!ds.length){
    h += '<p class="mute">まだ記録がありません。対象の開催日の予想が出ると、ここに載ります。</p>';
  } else {
    h += `<div class="cards">
      <div class="card"><div class="l">累計の収支</div><div class="v ${cls(T.ret-T.stake)}">${sgn(T.ret-T.stake)}</div></div>
      <div class="card"><div class="l">回収率</div><div class="v">${T.stake?(T.ret/T.stake*100).toFixed(1)+'%':'—'}</div></div>
      <div class="card"><div class="l">賭け金（結果が出た分）</div><div class="v">${yen(T.stake)}</div></div>
      <div class="card"><div class="l">払戻</div><div class="v">${yen(T.ret)}</div></div>
      <div class="card"><div class="l">的中</div><div class="v">${T.hit} / ${T.n}点</div></div>
      <div class="card"><div class="l">結果待ち</div><div class="v">${T.pend}点</div></div></div>
      <h2 class="sec">日ごと</h2><div class="tw"><table><tr><th>日付</th><th class="n">買い目</th><th class="n">払戻</th><th class="n">収支</th><th class="n">回収率</th></tr>` +
      ds.map(d=>{ const x=by[d]; return `<tr><td><a href="#${d}" data-d="${d}">${d}</a></td><td class="n">${x.n}${x.pend?`（+待ち${x.pend}）`:''}</td><td class="n">${yen(x.ret)}</td><td class="n ${cls(x.ret-x.stake)}">${sgn(x.ret-x.stake)}</td><td class="n">${x.stake?(x.ret/x.stake*100).toFixed(0)+'%':'—'}</td></tr>`; }).join('') + '</table></div>';
    ds.forEach((d,i)=>{
      h += `<details class="race"${i===0?' open':''}><summary><div class="rn">${d.slice(5)}</div><div class="rt">${d}（${wd(d)}）の買い目</div><div class="chev">›</div>
        <div class="rc">${by[d].bets.length}点・賭け金 ${yen(by[d].bets.reduce((a,b)=>a+b.stake,0))}</div></summary><div class="inner"><div class="tw"><table class="fx"><colgroup><col style="width:5.2em"><col style="width:6.6em"><col style="width:4.6em"><col><col style="width:3.8em"></colgroup>
        <tr><th>結果</th><th>レース</th><th>券種</th><th>買い目</th><th class="n">期待</th></tr>` +
        by[d].bets.map(b=>`<tr><td>${resultHtml(b)}</td><td>${b.race}${b.live?'<span class="mute">（直前）</span>':''}</td><td>${b.kind}</td><td><b>${b.comb}</b></td><td class="n">${Math.round(b.ev*100)}%</td></tr>`).join('') + '</table></div></div></details>';
    });
  }
  view.innerHTML = h + '<footer>結果は払戻の確定後に入ります。取消・除外の買い目は賭け金が戻ります。</footer>';
  view.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showLedger(b.dataset.m));
  view.querySelectorAll('a[data-d]').forEach(a => a.onclick = e => { e.preventDefault(); scrollTo(0,0); show(a.dataset.d); });
  document.getElementById('next').disabled = true; document.getElementById('prev').disabled = true;
  try{ history.replaceState(null,'', mode==='ref' ? '#pl-ref' : '#pl'); }catch(e){}
  scrollTo(0,0);
}

function show(d, keepVenue){
  ledgerOn = false; document.getElementById('pl').classList.remove('on');
  curDate = d; const D = DAYS[d];
  const vs = Object.keys(D.venues);
  if(!keepVenue || !vs.includes(venueOn)) venueOn = vs[0];
  const top = D.top.slice().sort((a,b)=>betCmp({v:a.venue,n:a.no,kind:a.kind,comb:a.comb},{v:b.venue,n:b.no,kind:b.kind,comb:b.comb})).map(t => `<div class="topi"><span class="r">${t.venue}${t.no}R</span><span class="k">${t.kind}</span>
    <span class="c">${t.comb}</span><span class="ev">${Math.round(t.ev*100)}%</span></div>`).join('');
  view.innerHTML = `
    <div class="meta">${d}（${wd(d)}）の予想 ・ ${updLabel(d)}版 ・ ${esc(D.model)}</div>
    <h2 class="sec">期待回収率100%以上の買い目（${D.top.length}点）</h2><div class="top">${top||'<div class="mute">なし</div>'}</div>
    <h2 class="sec">レース</h2>
    <div class="tabs">${vs.map(v=>`<button data-v="${v}" class="${v===venueOn?'on':''}">${v}</button>`).join('')}</div>
    <div class="wx">天気予報（気象庁）: ${esc(D.weather[venueOn]||'')}</div>
    ${D.venues[venueOn].map(r => raceHtml(r, D.ref)).join('')}
    <footer>期待回収率 = 的中確率 × オッズ。確率はモデルの推定で、当たりを約束するものではありません。オッズの * は、前売りの量が少ないため推定で置き換えた値。</footer>`;
  view.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { venueOn = b.dataset.v; show(curDate, true); });
  sel.value = d;
  const i = dates.indexOf(d);
  document.getElementById('next').disabled = i === 0;
  document.getElementById('prev').disabled = i === dates.length-1;
  try{ history.replaceState(null,'','#'+d); }catch(e){}
}

function updLabel(d){          // 更新時刻。開催日の当日なら時刻だけ、前日なら月/日をつける
  const u = DAYS[d].upd || DAYS[d].made;
  return u.slice(0,10)===d ? u.slice(11,16) : (+u.slice(5,7))+'/'+(+u.slice(8,10))+' '+u.slice(11,16);
}
sel.innerHTML = dates.map(d => `<option value="${d}">${d.slice(5).replace('-','/')}(${wd(d)}) ${updLabel(d)}版</option>`).join('');
sel.onchange = () => { scrollTo(0,0); show(sel.value); };
document.getElementById('prev').onclick = () => { if(!curDate) return; const i=dates.indexOf(curDate); if(i<dates.length-1){ scrollTo(0,0); show(dates[i+1]); } };
document.getElementById('next').onclick = () => { if(!curDate) return; const i=dates.indexOf(curDate); if(i>0){ scrollTo(0,0); show(dates[i-1]); } };
document.getElementById('pl').onclick = () => { ledgerOn ? show(dates[0]) : showLedger(); };
const h = location.hash.slice(1);
if(h==='pl' || h==='pl-ref') showLedger(h==='pl-ref'?'ref':'real'); else show(DAYS[h] ? h : dates[0]);
</script>
</body>
</html>
