<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>memo</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1f;--mute:#6e6e73;--line:#e3e3df;--card:#fff;--acc:#0b7a5a;--accbg:#e4f4ee;--warn:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--fg:#ececee;--mute:#9a9aa1;--line:#2c2c31;--card:#1a1a1e;--acc:#41d29b;--accbg:#173328;--warn:#f0a070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:4px 6px;display:flex;gap:4px;align-items:center}
header button,header select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 8px}
header select{flex:1;min-width:0;text-align:center;font-size:.9rem;padding:3px 2px}
main{max-width:1000px;margin:0 auto;padding:2px 6px 24px}
.meta{color:var(--mute);font-size:.8rem;margin:4px 2px}
h2.sec{font-size:.8rem;letter-spacing:.06em;color:var(--mute);margin:10px 2px 3px;font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:1px 0 4px}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:3px 12px;border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.wx{color:var(--mute);font-size:.8rem;margin:0 2px 3px}
details.race{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:4px 0;overflow:hidden}
details.race>summary{list-style:none;cursor:pointer;padding:4px 8px;display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;align-items:center}
details.race>summary::-webkit-details-marker{display:none}
.rn{grid-row:span 2;font-weight:700;font-size:1.05rem;background:var(--accbg);color:var(--acc);border-radius:6px;padding:2px 0;text-align:center;width:3.6em;min-width:3.6em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt{font-weight:600}
.rc{color:var(--mute);font-size:.8rem}
.hon{grid-column:2/4;font-size:.9rem}
.hon b{color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px;margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.card .l{color:var(--mute);font-size:.75rem}
.card .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--acc)}.neg{color:var(--warn)}
.win{color:var(--acc);font-weight:700}
.mute{color:var(--mute)}
header button.on{background:var(--acc);border-color:var(--acc);color:#fff}
a{color:var(--acc)}
.ver.live{color:var(--acc);font-weight:600}
.are{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:var(--warn);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}
.chev{color:var(--mute);transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.inner{padding:0 6px 6px;border-top:1px solid var(--line)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.topt{background:var(--card);border:1px solid var(--line);border-radius:10px}
.topt td.r,.topt th:first-child{position:sticky;left:0;z-index:1;background:var(--card);font-weight:600}
.topt tr:last-child td{border-bottom:0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:2px 4px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:.78rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
table.fx{table-layout:fixed}
table.fx td,table.fx th{overflow:hidden;text-overflow:ellipsis}
.m{font-weight:700;color:var(--acc);width:1.6em}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--acc);opacity:.55;vertical-align:middle;margin-left:6px}
.hf{font-size:.85rem;margin:0 0 4px}.hf select{font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.sub{font-size:.78rem;color:var(--mute);margin:6px 0 2px}
th.s{cursor:pointer;user-select:none;-webkit-user-select:none}
th.s.on{color:var(--acc)}
th.s.on::after{content:'▼';font-size:.65rem;margin-left:2px}
th.s.on.up::after{content:'▲'}
.ev{font-weight:700}
.ev.hi{color:var(--acc)}
td.up{color:var(--acc);font-weight:700}
footer{color:var(--mute);font-size:.75rem;margin:12px 2px}
</style>
</head>

  <select id="sel" aria-label="日付"></select>

</header>
<main id="view"></main>

<script>
const DAYS = JSON.parse(document.getElementById('data').textContent);
const dates = Object.keys(DAYS).sort().reverse();
const sel = document.getElementById('sel'), view = document.getElementById('view');
const pct = (x, d=1) => (x*100).toFixed(d) + '%';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const START = '2026-10-17';
const ARE = 0.35;                 // 荒れ度（三連単10万円超の見込み、upset.py）がこれ以上で「荒れそう」
const areHtml = (u, full) => u==null ? '' : u>=ARE ? `<span class="are">荒れそう${full?' '+pct(u,0):''}</span>` : (full ? `<span style="white-space:nowrap">荒れ度 ${pct(u,0)}</span>` : '');
const yen = n => n.toLocaleString('ja-JP') + '円';
const sgn = n => (n>0?'+':n<0?'−':'') + Math.abs(n).toLocaleString('ja-JP') + '円';
const cls = n => n>0?'pos':n<0?'neg':'';
function resultHtml(b){
  if(!b.stake) return '';
  if(b.ret===undefined || b.ret===null) return '<span class="mute">結果待ち</span>';
  if(b.res==='返還') return '返還';
  if(b.res==='的中' || (b.res===undefined && b.ret>b.stake)) return '<span class="win">'+yen(b.ret)+'</span>';   // 複勝の元返し（払戻＝賭け金）も的中
  return '<span class="mute">外れ</span>';
}
const KINDS = ['単勝','複勝','枠連','馬連','ワイド','馬単','三連複','三連単'];
const VORD = ['札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉'];
const nums = c => (String(c).match(/\d+/g)||[]).map(Number);
function cmpArr(a,b){ for(let i=0;i<Math.max(a.length,b.length);i++){ const x=a[i]??-1, y=b[i]??-1; if(x!==y) return x-y; } return 0; }
const kidx = k => { const i = KINDS.indexOf(k); return i<0 ? KINDS.length : i; };
function betCmp(a,b){            // 競馬場 → 何レース目 → 券種 → 買い目の番号
  return (VORD.indexOf(a.v)-VORD.indexOf(b.v)) || (a.n-b.n) || (kidx(a.kind)-kidx(b.kind)) || cmpArr(nums(a.comb), nums(b.comb));
}
let venueOn = null, curDate = null, ledgerOn = false;
const THRS = [95,100,105,110,115,120];      // 日付の画面の絞り込み（期待回収率がこの値以上の買い目を出す）
const HITS = [0,1,3,5,10];                // 的中率で絞る（買い目の的中確率が この値（%）以上）
let thr = 95, hit = 0, shownKey = '';
function jstNow(){ const s = new Date(Date.now()+9*36e5).toISOString(); return {d:s.slice(0,10), t:s.slice(11,16)}; }   // 日本時間の今日と今の時刻
function upcoming(d){             // 今日の日付は、発走時刻が今以降のレースだけ（発走時刻の無いレースは出す）。ほかの日はすべて
  const n = jstNow();
  return d !== n.d ? (tm => true) : (tm => !tm || tm >= n.t);
}
function visKey(d){ const n = jstNow(); return d !== n.d ? '' : Object.values(DAYS[d].venues).flat().filter(r => !r.time || r.time >= n.t).map(r => r.id).join(); }
try{ const t = +localStorage.getItem('thr'); if(THRS.includes(t)) thr = t; const h = +localStorage.getItem('hit'); if(HITS.includes(h)) hit = h; }catch(e){}
const wd = d => '日月火水木金土'[new Date(d+'T00:00:00').getDay()];

// 出走馬の並び替え（見出しを押す。同じ見出しをもう一度押すと逆順。全レース共通で、この端末に覚える）
const HSORT = {   // d: 最初に押したときの向き（1 小さい順、-1 大きい順）
  no:   {label:'馬番の順', d:1,  v:x => x.no},
  name: {label:'馬名の順', d:1,  v:x => x.name},
  p1:   {label:'1着の確率の高い順', d:-1, v:x => x.p1},
  p3:   {label:'3着内の確率の高い順', d:-1, v:x => x.p3},
  odds: {label:'単勝オッズの低い順', d:1,  v:x => x.odds},
  ev:   {label:'期待の高い順', d:-1, v:x => hev(x)},
  train:{label:'調教の評価の順', d:1,  v:x => x.train},
};
const HCOLS = [['no','番',1],['name','馬名',0],['p1','1着',1],['p3','3着内',1],['odds','オッズ',1],['ev','期待',1],['train','調教',0]];
let hsort = {k:'p1', d:-1};
try{ const s = JSON.parse(localStorage.getItem('hsort')||'null'); if(s && HSORT[s.k] && (s.d===1||s.d===-1)) hsort = s; }catch(e){}
function sortHorses(h){
  const f = HSORT[hsort.k].v, d = hsort.d;
  return h.slice().sort((a,b) => {
    const x = f(a), y = f(b);
    const ex = x==null || x==='', ey = y==null || y==='';     // 値の無い馬（オッズの無い取消など）はいつも最後
    if(ex || ey) return ex===ey ? a.no-b.no : (ex ? 1 : -1);
    const c = typeof x==='string' ? x.localeCompare(y,'ja') : x-y;
    return c ? c*d : a.no-b.no;
  });
}

const upCls = (odds, p) => odds!=null && p>0 && odds*p >= 1 ? ' up' : '';
// 出走馬の期待 = 単勝を買ったときの期待回収率。版の csv に買い目と同じ計算の値（ev_win、割り引きを入れた日からはそれ込み）があればそれ、無ければ 単勝オッズ × 1着の確率（直前版の単勝の買い目と同じ値）
function hev(x){ return x.ev!=null ? x.ev : (x.odds!=null && x.p1>0 ? x.odds*x.p1 : null); }

let opened = new Set();           // 表示を作り直すとき、開いていたレースを開いたままにする
function raceHtml(r, ref){
  const h = r.horses, hon = h[0];
  const rows = sortHorses(h).map(x => `<tr><td class="m">${x.mark}</td><td class="n">${x.no}</td><td>${esc(x.name)}</td>
    <td class="n">${pct(x.p1)}<span class="bar" style="width:${Math.round(x.p1*90)}px"></span></td>
    <td class="n">${pct(x.p3,0)}</td><td class="n${hev(x)>=1?' up':''}">${x.odds!=null?x.odds.toFixed(1):'—'}</td><td class="n ev ${hev(x)>=1.2?'hi':''}">${hev(x)!=null?Math.round(hev(x)*100)+'%':'—'}</td><td>${esc(x.train)}</td></tr>`).join('');
  const hasStake = false;  // 日付の画面には結果を出さない（収支は『収支』ボタン）
  const bets = r.bets.map(b => `<tr>${hasStake?`<td>${resultHtml(b)}</td>`:''}<td>${b.kind}</td><td><b>${b.comb}</b></td><td class="n">${pct(b.p)}</td>
    <td class="n${b.ev>=1?' up':''}">${b.odds.toFixed(1)}${b.est?"*":""}</td><td class="n ev ${b.ev>=1.2?'hi':''}">${Math.round(b.ev*100)}%</td></tr>`).join('');
  return `<details class="race" data-id="${r.id}"${opened.has(r.id)?' open':''}><summary>
    <div class="rn">${r.no}R</div><div class="rt">${esc(r.name)}</div><div class="chev">›</div>
    <div class="rc">${r.cond}・${r.time}・<span class="ver ${r.live?'live':''}">${r.live?'直前 '+r.live+'版':'前日版'}</span>${r.ur!=null?'・'+areHtml(r.ur, true):''}</div>
    <div class="hon">◎ <b>${hon.no} ${esc(hon.name)}</b> ${pct(hon.p1,0)}</div></summary>
    <div class="inner">
      <div class="sub">出走馬（${HSORT[hsort.k].label}${hsort.d===HSORT[hsort.k].d?'':'（逆順）'}・見出しを押すと並び替え）</div>
      <div class="tw"><table><tr><th></th>${HCOLS.map(([k,l,n]) => `<th class="s${n?' n':''}${hsort.k===k?' on'+(hsort.d>0?' up':''):''}" data-k="${k}">${l}</th>`).join('')}</tr>${rows}</table></div>
      <div class="sub">買い目（券種・買い目の順・各100円）</div>
      <div class="tw"><table><tr>${hasStake?'<th>結果</th>':''}<th>券種</th><th>買い目</th><th class="n">的中</th><th class="n">オッズ</th><th class="n">期待</th></tr>${bets}</table></div>
    </div></details>`;
}

function ledgerRows(){            // 賭け金のある買い目
  const out=[];
  for(const d of dates) for(const [v,rs] of Object.entries(DAYS[d].venues)) for(const r of rs) for(const b of r.bets)
    if(b.stake) out.push({d, ref:!!DAYS[d].ref, race:v+r.no+'R', v, n:r.no, live:!!r.live, at:r.at, post:r.time, ...b});
  return out.sort(betCmp);
}
function showLedger(mode){
  mode = mode || 'real'; ledgerOn = true; curDate = null;
  document.getElementById('pl').classList.add('on');
  const all = ledgerRows(), rows = all.filter(b => b.ref === (mode==='ref')), by = {};
  for(const b of rows){
    const x = by[b.d] = by[b.d] || {stake:0, ret:0, n:0, hit:0, pend:0, bets:[]};
    x.bets.push(b);
    if(b.ret===undefined || b.ret===null){ x.pend++; continue; }
    x.n++; x.stake+=b.stake; x.ret+=b.ret; x.hit+=(b.res===undefined ? b.ret>b.stake : b.res==='的中');
  }
  const ds = Object.keys(by).sort().reverse();
  const T = ds.reduce((a,d)=>({stake:a.stake+by[d].stake, ret:a.ret+by[d].ret, n:a.n+by[d].n, hit:a.hit+by[d].hit, pend:a.pend+by[d].pend}), {stake:0,ret:0,n:0,hit:0,pend:0});
  const nRef = all.filter(b => b.ref).length;
  let h = nRef ? `<div class="tabs"><button data-m="real" class="${mode==='real'?'on':''}">記録</button><button data-m="ref" class="${mode==='ref'?'on':''}">過去の参考</button></div>` : '';
  h += mode==='ref'
    ? `<div class="meta">参考（仮）: 記録の開始（${START}）より前の予想に、同じルールで仮にかけていたらの収支。実際にかけたものではありません。</div>`
    : `<div class="meta">収支の記録（${START} 以降）。期待回収率100%以上の買い目に、100円×期待回収率の整数部分をかけた場合。直前版が出たレースは直前版の買い目。</div>`;
  if(!ds.length){
    h += '<p class="mute">まだ記録がありません。対象の開催日の予想が出ると、ここに載ります。</p>';
  } else {
    h += `<div class="cards">
      <div class="card"><div class="l">累計の収支</div><div class="v ${cls(T.ret-T.stake)}">${sgn(T.ret-T.stake)}</div></div>
      <div class="card"><div class="l">回収率</div><div class="v">${T.stake?(T.ret/T.stake*100).toFixed(1)+'%':'—'}</div></div>
      <div class="card"><div class="l">賭け金（結果が出た分）</div><div class="v">${yen(T.stake)}</div></div>
      <div class="card"><div class="l">払戻</div><div class="v">${yen(T.ret)}</div></div>
      <div class="card"><div class="l">的中</div><div class="v">${T.hit} / ${T.n}点</div></div>
      <div class="card"><div class="l">結果待ち</div><div class="v">${T.pend}点</div></div></div>
      <h2 class="sec">日ごと</h2><div class="tw"><table><tr><th>日付</th><th class="n">買い目</th><th class="n">払戻</th><th class="n">収支</th><th class="n">回収率</th></tr>` +
      ds.map(d=>{ const x=by[d]; return `<tr><td><a href="#${d}" data-d="${d}">${d}</a></td><td class="n">${x.n}${x.pend?`（+待ち${x.pend}）`:''}</td><td class="n">${yen(x.ret)}</td><td class="n ${cls(x.ret-x.stake)}">${sgn(x.ret-x.stake)}</td><td class="n">${x.stake?(x.ret/x.stake*100).toFixed(0)+'%':'—'}</td></tr>`; }).join('') + '</table></div>';
    ds.forEach((d,i)=>{
      h += `<details class="race"><summary><div class="rn">${d.slice(5)}</div><div class="rt">${d}（${wd(d)}）の買い目</div><div class="chev">›</div>
        <div class="rc">${by[d].bets.length}点・賭け金 ${yen(by[d].bets.reduce((a,b)=>a+b.stake,0))}</div></summary><div class="inner"><div class="tw"><table>
        <tr><th>結果</th><th>レース</th><th>券種</th><th>買い目</th><th class="n">オッズ</th><th class="n">期待</th><th>出した時刻</th></tr>` +
        by[d].bets.map(b=>`<tr><td>${resultHtml(b)}</td><td>${b.race}</td><td>${b.kind}</td><td><b>${b.comb}</b></td><td class="n">${b.odds}${b.est?'*':''}</td><td class="n">${Math.round(b.ev*100)}%</td><td>${(b.at||'').slice(5)}</td></tr>`).join('') + '</table></div></div></details>';
    });
  }
  view.innerHTML = h + '<footer>結果は払戻の確定後に入ります。取消・除外の買い目は賭け金が戻ります。オッズと「出した時刻」は買い目を出した時点のもの（直前版は発走の60・30・10分前に出し直した版のうち発走前の最後の版、無ければ前日の夜）。払戻は確定オッズ。*は推定のオッズ。</footer>';
  view.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showLedger(b.dataset.m));
  view.querySelectorAll('a[data-d]').forEach(a => a.onclick = e => { e.preventDefault(); scrollTo(0,0); show(a.dataset.d); });
  try{ history.replaceState(null,'', mode==='ref' ? '#pl-ref' : '#pl'); }catch(e){}
  scrollTo(0,0);
}

function show(d, keepVenue){
  ledgerOn = false; document.getElementById('pl').classList.remove('on');
  opened = new Set(keepVenue ? [...view.querySelectorAll('details[open][data-id]')].map(x => x.dataset.id) : []);
  curDate = d; const D = DAYS[d], keep = upcoming(d), isToday = d === jstNow().d;
  shownKey = visKey(d);
  const venues = {};
  for(const [v,rs] of Object.entries(D.venues)){ const x = rs.filter(r => keep(r.time)); if(x.length) venues[v] = x; }
  const vs = Object.keys(venues);
  if(!keepVenue || !vs.includes(venueOn)) venueOn = vs[0];
  const topAll = D.top.filter(t => Math.round(t.ev*100) >= thr && t.p*100 >= hit && keep(t.time));
  // 期待回収率の高い買い目の一覧（表。オッズ・的中確率・発走時刻も出し、はみ出す分は横にスクロール。レースの列は左に固定）
  const top = topAll.slice().sort((a,b)=>betCmp({v:a.venue,n:a.no,kind:a.kind,comb:a.comb},{v:b.venue,n:b.no,kind:b.kind,comb:b.comb})).map(t => `<tr><td class="r">${t.venue}${t.no}R${areHtml(t.ur, false)}</td>
    <td>${t.kind}</td><td><b>${t.comb}</b></td><td class="n ev ${t.ev>=1.2?'hi':''}">${Math.round(t.ev*100)}%</td>
    <td class="n${t.ev>=1?' up':''}">${t.odds.toFixed(1)}${t.est?'*':''}</td><td class="n">${pct(t.p)}</td><td class="n">${t.time||''}</td></tr>`).join('');
  view.innerHTML = `
    <div class="meta">${d}（${wd(d)}）の予想 ・ ${updLabel(d)}版 ・ ${esc(D.model)}</div>
    <h2 class="sec">期待回収率${thr}%以上・的中${hit?hit+'%以上':'どれでも'}の買い目（${topAll.length}点）</h2>
    <div class="hf">期待回収率 <select id="thr">${THRS.map(x=>`<option value="${x}"${x===thr?' selected':''}>${x}%以上</option>`).join('')}</select>
    的中 <select id="hit">${HITS.map(x=>`<option value="${x}"${x===hit?' selected':''}>${x?x+'%以上':'どれでも'}</option>`).join('')}</select></div>${top ? `<div class="tw topt"><table><tr><th>レース</th><th>券種</th><th>買い目</th><th class="n">期待</th><th class="n">オッズ</th><th class="n">的中</th><th class="n">発走</th></tr>${top}</table></div>` : '<div class="mute">なし</div>'}
    <h2 class="sec">${isToday?'これから発走するレース':'レース'}</h2>
    ${vs.length ? `<div class="tabs">${vs.map(v=>`<button data-v="${v}" class="${v===venueOn?'on':''}">${v}</button>`).join('')}</div>
    <div class="wx">天気予報（気象庁）: ${esc(D.weather[venueOn]||'')}</div>
    ${venues[venueOn].map(r => raceHtml(r, D.ref)).join('')}` : '<div class="mute">今日のレースはすべて発走しました</div>'}
    <footer>期待（期待回収率） = 的中確率 × オッズ。100%以上はオッズを緑で示す。出走馬の期待 = 単勝オッズ × 1着の確率（その馬の単勝を買ったときの期待回収率）。オッズはその版の時刻の値で、締め切りまでに動く。確率はモデルの推定で、当たりを約束するものではありません。オッズの * は、前売りの量が少ないため推定で置き換えた値。荒れ度 = 三連単の払戻が10万円を超える見込み（1着の確率の散らばりと頭数から、過去のレースで当てはめた式。平均は約2割）。35%以上に「荒れそう」。荒れやすさはオッズにもほぼ表れているので、荒れそうなレースで穴を買えば得、というわけではありません。</footer>`;
  view.querySelectorAll('.tabs button[data-v]').forEach(b => b.onclick = () => { venueOn = b.dataset.v; show(curDate, true); });
  document.getElementById('thr').onchange = e => { thr = +e.target.value; try{ localStorage.setItem('thr', thr); }catch(e){} show(curDate, true); };
  document.getElementById('hit').onchange = e => { hit = +e.target.value; try{ localStorage.setItem('hit', hit); }catch(e){} show(curDate, true); };
  sel.value = d;
  try{ history.replaceState(null,'','#'+d); }catch(e){}
}

function updLabel(d){          // 更新時刻。開催日の当日なら時刻だけ、前日なら月/日をつける
  const u = DAYS[d].upd || DAYS[d].made;
  return u.slice(0,10)===d ? u.slice(11,16) : (+u.slice(5,7))+'/'+(+u.slice(8,10))+' '+u.slice(11,16);
}
sel.innerHTML = dates.map(d => `<option value="${d}">${d.slice(5).replace('-','/')}(${wd(d)})</option>`).join('');
sel.onchange = () => { scrollTo(0,0); show(sel.value); };
// 開いたままの今日のページは、レースが発走して消えたら（1分ごと・画面に戻ったとき）作り直す
const refresh = () => { if(curDate && !ledgerOn && visKey(curDate) !== shownKey) show(curDate, true); };
setInterval(refresh, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });
view.addEventListener('click', e => {   // 出走馬の表の見出し（data-k）を押したら並び替え
  const th = e.target.closest('th[data-k]'); if(!th) return;
  const k = th.dataset.k;
  hsort = hsort.k===k ? {k, d:-hsort.d} : {k, d:HSORT[k].d};
  try{ localStorage.setItem('hsort', JSON.stringify(hsort)); }catch(e){}
  show(curDate, true);
});
document.getElementById('pl').onclick = () => { ledgerOn ? show(dates[0]) : showLedger(); };
const h = location.hash.slice(1);
if(h==='pl' || h==='pl-ref') showLedger(h==='pl-ref'?'ref':'real'); else show(DAYS[h] ? h : dates[0]);
</script>
</body>
</html>
